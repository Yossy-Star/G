<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Image Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Helvetica Neue', sans-serif; }

    /* ── 真っ黒修正: AR.js が生成する video/canvas を全画面に強制 ── */
    a-scene { width: 100vw !important; height: 100vh !important; }
    .a-canvas { width: 100% !important; height: 100% !important; }
    video {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 32px;
    }

    #guide {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font-size: 13px;
      letter-spacing: 0.08em;
      padding: 10px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      text-align: center;
      line-height: 1.6;
    }

    #guide span {
      display: block;
      font-size: 11px;
      opacity: 0.55;
      margin-top: 2px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>

  <!-- A-Frame -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>

  <!-- AR.js (A-Frame integration) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body>

  <!-- UI Overlay -->
  <div id="overlay">
    <div id="guide">
      Hiroマーカーにカメラを向けてください
      <span>Point camera at HIRO marker</span>
    </div>
  </div>

  <!-- AR Scene -->
  <a-scene
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true; antialias: true;"
    vr-mode-ui="enabled: false"
  >

    <!-- Asset: image1.png（同じリポジトリにアップロード済み）-->
    <a-assets>
      <img id="ar-image" src="image1.png" crossorigin="anonymous" />
    </a-assets>

    <!-- Hiroマーカー検出時に画像を表示 -->
    <a-marker preset="hiro">
      <!--
        a-image はマーカー平面に平行（XZ 平面上）に配置されます。
        rotation="-90 0 0" で水平に寝かせ、マーカーと平行になります。
        width / height はお好みで調整してください（単位はメートル相当）。
      -->
      <a-image
        src="#ar-image"
        width="1"
        height="1"
        rotation="-90 0 0"
        position="0 0.01 0"
      ></a-image>
    </a-marker>

    <!-- AR カメラ -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
