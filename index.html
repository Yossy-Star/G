<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stable WebAR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

<a-scene
    embedded
    vr-mode-ui="enabled: false"

    renderer="
        logarithmicDepthBuffer: true;
        precision: medium;
        antialias: true;
        colorManagement: true;
    "

    arjs="
        sourceType: webcam;
        trackingMethod: best;
        debugUIEnabled: false;

        detectionMode: mono;

        maxDetectionRate: 60;

        canvasWidth: 1280;
        canvasHeight: 960;
    "
>

    <a-assets>
        <!-- JPG推奨 -->
        <img id="img1" src="image1.jpg">
        <img id="img2" src="image2.jpg">
    </a-assets>

    <a-marker
        preset="hiro"

        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5"
    >

        <a-image
            src="#img1"

            position="-0.7 0 0"
            rotation="-90 0 0"

            width="1"
            height="1"

            material="
                transparent: true;
                side: double;
            "
        ></a-image>

        <a-image
            src="#img2"

            position="0.7 0 0"
            rotation="-90 0 0"

            width="1"
            height="1"

            material="
                transparent: true;
                side: double;
            "
        ></a-image>

    </a-marker>

    <!-- カメラ -->
    <a-entity
        camera
        look-controls="enabled: false"
    ></a-entity>

</a-scene>

</body>
</html>
