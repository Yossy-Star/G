<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <!-- キャッシュ禁止 -->
    <meta http-equiv="Cache-Control"
          content="no-cache, no-store, must-revalidate">

    <meta http-equiv="Pragma"
          content="no-cache">

    <meta http-equiv="Expires"
          content="0">

    <title>Simple WebAR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
            width: 100%;
            height: 100%;
        }

        canvas {
            position: fixed !important;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>

<a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
        antialias: true;
        alpha: true;
        precision: mediump;
        logarithmicDepthBuffer: true;
    "

    arjs="
        sourceType: webcam;

        debugUIEnabled: false;

        trackingMethod: best;

        displayWidth: 1280;
        displayHeight: 720;

        canvasWidth: 1280;
        canvasHeight: 720;
    "
>

    <!-- 環境光 -->
    <a-entity
        light="
            type: ambient;
            intensity: 1.5;
        "
    ></a-entity>

    <!-- Hiroマーカー -->
    <a-marker

        preset="hiro"

        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5"

    >

        <!-- 画像 -->
        <a-image

            src="image1.jpg?v=20260512"

            position="0 0.01 0"

            rotation="-90 0 0"

            width="1.5"
            height="1.5"

            material="
                shader: flat;
                side: double;
                transparent: true;
                alphaTest: 0.01;
                depthTest: true;
                depthWrite: true;
            "

        ></a-image>

    </a-marker>

    <!-- カメラ -->
    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
