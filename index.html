<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">
    <meta http-equiv="Cache-Control"
          content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma"
          content="no-cache">
    <meta http-equiv="Expires"
          content="0">
    <title>THICK BOARD TEST</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }
    </style>
</head>
<body>
<a-scene
    vr-mode-ui="enabled: false"
    renderer="
        antialias: true;
        alpha: true;
        precision: mediump;
    "
    arjs="
        sourceType: webcam;
        debugUIEnabled: false;
        trackingMethod: best;
        displayWidth: 1280;
        displayHeight: 720;
        canvasWidth: 1280;
        canvasHeight: 720;
    "
>
    <a-marker
        preset="hiro"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5"
    >
        <!-- rotation="-90 0 0" でマーカー面と平行に寝かせる -->
        <a-plane
            position="0 0.01 0"
            rotation="-90 0 0"
            width="1.5"
            height="1.5"
            material="
                src: image1.jpg?v=1000;
                shader: flat;
                side: double;
            "
        ></a-plane>
    </a-marker>

    <a-entity camera></a-entity>
</a-scene>
</body>
</html>
