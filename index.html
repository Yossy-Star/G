<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>AR Image Viewer</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
      overflow: hidden;
    }

    #ui-overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 999;
      pointer-events: none;
    }

    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    }

    #title {
      font-size: 13px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #7fffd4;
      opacity: 0.9;
    }

    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #7fffd4;
      box-shadow: 0 0 8px #7fffd4;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    #instruction-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 999;
      pointer-events: none;
      padding: 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    }

    #instruction-text {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.55);
      text-align: center;
      text-transform: uppercase;
    }

    #marker-hint {
      font-size: 10px;
      color: rgba(127,255,212,0.6);
      text-align: center;
      margin-top: 6px;
      letter-spacing: 0.1em;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-ring {
      width: 48px; height: 48px;
      border: 2px solid rgba(127,255,212,0.15);
      border-top-color: #7fffd4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-text {
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(127,255,212,0.7);
    }
  </style>

  <!-- A-Frame 1.5.0 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <script>
    /**
     * 修正の核心：
     * THREE.js r152以降、colorManagement が有効だとテクスチャが
     * sRGB→Linear 変換を「二重」に受けて真っ暗になる。
     * sceneが初期化されたタイミングで、テクスチャに
     * THREE.SRGBColorSpace を明示的にセットして正しく修正する。
     */
    AFRAME.registerComponent('fix-texture-colorspace', {
      init: function () {
        const el = this.el;

        // テクスチャがロードされるたびに colorSpace を強制セット
        el.addEventListener('materialtextureloaded', function (e) {
          const texture = e.detail.texture;
          if (texture) {
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.needsUpdate = true;
          }
        });

        // assets経由でロード済みの場合も対応
        el.addEventListener('model-loaded', function () {
          const mesh = el.getObject3D('mesh');
          if (!mesh) return;
          mesh.traverse(function (node) {
            if (node.isMesh && node.material && node.material.map) {
              node.material.map.colorSpace = THREE.SRGBColorSpace;
              node.material.map.needsUpdate = true;
              node.material.needsUpdate = true;
            }
          });
        });
      }
    });
  </script>

</head>

<body>

  <div id="loading-screen">
    <div class="loader-ring"></div>
    <div class="loader-text">カメラを起動中...</div>
  </div>

  <div id="ui-overlay">
    <div id="header">
      <span id="title">AR IMAGE VIEWER</span>
      <div id="status-dot"></div>
    </div>
  </div>

  <div id="instruction-panel">
    <div id="instruction-text">マーカーにカメラを向けてください</div>
    <div id="marker-hint">Hiro マーカー対応</div>
  </div>

  <!--
    colorManagement: false
      → THREE r152以降の二重カラー変換を無効化。これが黒画像の根本原因。
    alpha: true
      → ARカメラ映像とWebGLレイヤーの正しい合成に必須。
    embedded は削除のまま維持。
  -->
  <a-scene
    vr-mode-ui="enabled: false"
    renderer="
      antialias: true;
      alpha: true;
      precision: mediump;
      colorManagement: false;
    "
    arjs="
      sourceType: webcam;
      debugUIEnabled: false;
      videoTexture: false;
      trackingMethod: best;
    "
  >

    <a-assets timeout="15000">
      <img
        id="ar-image"
        src="image1.png?v=20260512"
        crossorigin="anonymous"
      >
    </a-assets>

    <a-marker
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!--
        fix-texture-colorspace コンポーネントでテクスチャの
        colorSpace を正しくセット。
        rotation="-90 0 0" で水平に寝かせる（前回良かった角度）。
        side: double で表裏両面から見える。
      -->
      <a-plane
        id="ar-plane"
        src="#ar-image"
        position="0 0.01 0"
        rotation="-90 0 0"
        width="1.5"
        height="1.5"
        material="
          shader: flat;
          side: double;
          color: #ffffff;
        "
        fix-texture-colorspace
      ></a-plane>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>

    // 画像エラー検知
    document.getElementById('ar-image').addEventListener('error', () => {
      console.warn('[AR] image load error');
      document.getElementById('instruction-text').textContent =
        '画像の読み込みに失敗しました';
    });

    // Loading Screen
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading-screen').classList.add('hidden');
      }, 1800);
    });

    // Marker Detection
    const marker          = document.querySelector('a-marker');
    const statusDot       = document.getElementById('status-dot');
    const instructionText = document.getElementById('instruction-text');

    marker.addEventListener('markerFound', () => {
      statusDot.style.background  = '#00ff88';
      statusDot.style.boxShadow   = '0 0 12px #00ff88';
      instructionText.textContent = 'マーカー検出 — 画像を表示中';
    });

    marker.addEventListener('markerLost', () => {
      statusDot.style.background  = '#7fffd4';
      statusDot.style.boxShadow   = '0 0 8px #7fffd4';
      instructionText.textContent = 'マーカーにカメラを向けてください';
    });

  </script>

</body>
</html>
