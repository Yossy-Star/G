<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stable WebAR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

<a-scene

    vr-mode-ui="enabled: false"

    renderer="
        antialias: true;
        alpha: true;
        precision: mediump;
        colorManagement: true;
    "

    arjs="
        sourceType: webcam;
        trackingMethod: best;
        debugUIEnabled: false;

        detectionMode: mono;

        canvasWidth: 640;
        canvasHeight: 480;
    "
>

    <a-assets>
        <img id="img1" src="image1.jpg">
        <img id="img2" src="image2.jpg">
    </a-assets>

    <a-marker
        preset="hiro"

        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5"
    >

        <!-- 画像1 -->
        <a-plane
            position="-0.7 0 0"
            rotation="-90 0 0"

            width="1"
            height="1"

            material="
                src: #img1;
                transparent: true;
                side: double;
            "
        ></a-plane>

        <!-- 画像2 -->
        <a-plane
            position="0.7 0 0"
            rotation="-90 0 0"

            width="1"
            height="1"

            material="
                src: #img2;
                transparent: true;
                side: double;
            "
        ></a-plane>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
