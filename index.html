<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <!-- キャッシュ禁止 -->
    <meta http-equiv="Cache-Control"
          content="no-cache, no-store, must-revalidate">

    <meta http-equiv="Pragma"
          content="no-cache">

    <meta http-equiv="Expires"
          content="0">

    <title>Simple WebAR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }
    </style>
</head>

<body>

<a-scene

    vr-mode-ui="enabled: false"

    renderer="
        antialias: true;
        alpha: true;
        precision: mediump;
    "

    arjs="
        sourceType: webcam;

        debugUIEnabled: false;

        trackingMethod: best;

        displayWidth: 1280;
        displayHeight: 720;

        canvasWidth: 1280;
        canvasHeight: 720;
    "
>

    <!-- Hiroマーカー -->
    <a-marker
        preset="hiro"

        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5"
    >

        <!-- 表面 -->
        <a-plane
            src="image1.jpg?v=20260511"

            position="0 0.01 0"

            rotation="0 0 0"

            width="1.5"
            height="1.5"

            material="
                shader: flat;
                side: front;
            "
        ></a-plane>

        <!-- 裏面 -->
        <a-plane
            src="image1.jpg?v=20260511"

            position="0 0.011 0"

            rotation="0 180 0"

            width="1.5"
            height="1.5"

            material="
                shader: flat;
                side: front;
            "
        ></a-plane>

    </a-marker>

    <!-- カメラ -->
    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
