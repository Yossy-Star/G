<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Stable</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

<a-scene
    vr-mode-ui="enabled: false"

    renderer="
        antialias: true;
        alpha: true;
        precision: mediump;
    "

    arjs="
        sourceType: webcam;
        debugUIEnabled: false;
    "
>

    <a-marker
        preset="hiro"
        smooth="true"
    >

        <!-- 画像1 -->
        <a-entity
            geometry="
                primitive: plane;
                width: 1;
                height: 1;
            "

            material="
                src: image1.jpg;
                shader: flat;
                side: double;
                transparent: false;
            "

            rotation="-90 0 0"
            position="-0.7 0 0"
        ></a-entity>

        <!-- 画像2 -->
        <a-entity
            geometry="
                primitive: plane;
                width: 1;
                height: 1;
            "

            material="
                src: image2.jpg;
                shader: flat;
                side: double;
                transparent: false;
            "

            rotation="-90 0 0"
            position="0.7 0 0"
        ></a-entity>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
